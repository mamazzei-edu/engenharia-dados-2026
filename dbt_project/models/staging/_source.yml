version: 2

sources:
  - name: bronze_processado
    meta:
      external-location> "s3:/silver/bronze_processado/{name}"
    tables:
      - name: pedidos_ecommerce
  - name: bronze_ecommerce
    description: >
      Dados brutos do sistema de e-commerce ingeridos na camada Bronze.
      Arquivos Parquet particionados por data de ingestão no MinIO.
    schema: bronze_raw
    meta:
      owner: "Equipe de Engenharia de Dados"
      camada: "Bronze"

    tables:
      - name: pedidos
        description: >
          Tabela de pedidos brutos com 1.000.000 registros sintéticos.
          Contém inconsistências intencionais para demonstração de limpeza.
        identifier: "read_parquet('s3://bronze/ecommerce_sintetico/**/*.parquet')"
        columns:
          - name: id_pedido
            description: "Identificador único do pedido (chave primária)"
            tests:
              - not_null
          - name: id_cliente
            description: "Identificador do cliente que realizou o pedido"
            tests:
              - not_null
          - name: status_pedido
            description: "Status atual do pedido"
            tests:
              - accepted_values:
                  values: ['concluido', 'cancelado', 'pendente', 'reembolsado']
          - name: valor_total
            description: "Valor total do pedido em Reais"
            tests:
              - not_null
