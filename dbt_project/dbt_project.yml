name: 'ecommerce_lakehouse'
version: '1.0.0'
config-version: 2
# Diretório onde o dbt procura os arquivos de perfil de conexão
profile: 'ecommerce_lakehouse'
# Caminhos dos diretórios do projeto
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
# Diretório de saída dos artefatos compilados
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages

# ── Configurações de Materialização por Camada ────────────────────────────────
# Cada camada tem uma estratégia de materialização diferente:
#   staging:      views  — leves, sem custo de armazenamento, sempre atualizadas
#   intermediate: views  — transformações intermediárias, geralmente não persis
#   marts:        tables — camada Gold, materializadas para performance de leitu
models:
  ecommerce_lakehouse:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts
