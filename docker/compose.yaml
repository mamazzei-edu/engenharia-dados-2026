services:
  minio:
    image: minio/minio:latest
    container_name: minio-datalake
    ports:
      - "9000:9000" # Porta para acesso via api
      - "9001:9001" # Porta para gerenciamento web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
  # Jupyter com PySpark e suporte a S3 (MinIO)
  spark-jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-jupyter
    ports:
      - "8888:8888" # Interface Jupyter
      - "4040:4040" # Spark UI (monitoramento de jobs)
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      SPARK_OPTS: "--driver-java-options=-Xms1g --driver-java-options=-Xmx4g"
    volumes:
      - ../notebooks:/home/jovyan/notebooks
      - ../scripts:/home/jovyan/scripts
      - ../data:/home/jovyan/data

volumes:
  minio_data:
    driver: local
